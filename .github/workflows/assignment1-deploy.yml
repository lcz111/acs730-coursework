name: Assignment 1 Terraform Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'assignment1/**'
      - '!assignment1/evidence/**'
      - '!assignment1/REPORT.md'
      - '!assignment1/README.md'
      - '.github/workflows/assignment1-deploy.yml'

permissions:
  contents: read

concurrency:
  group: assignment1-terraform-deployment
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: assignment1/terraform/staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Terraform Outputs
        run: terraform output -no-color

  prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: staging
    environment: prod

    defaults:
      run:
        working-directory: assignment1/terraform/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Terraform Outputs
        run: terraform output -no-color
