name: Lab 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print message
        run: echo "Lab 3 CI workflow is running!"

      - name: Check repository
        run: |
          pwd
          ls -la
          echo "CI check completed successfully!"
